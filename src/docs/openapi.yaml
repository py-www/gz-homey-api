openapi: 3.0.3
info:
  title: GZ HOMEY API
  version: 1.0.0
  description: |
    GZ HOMEY 氛圍居家選物電商的後端 API。

    **怎麼測試需要登入的 API**
    1. 先打 `POST /api/auth/login`，從回應複製 `token`
    2. 按右上角 **Authorize**，貼上 token（不用加 `Bearer `）
    3. 之後打 🔒 的 API 會自動帶上 token

    **測試帳號**
    - 一般會員：`user@gzhomey.test` / `User1234`
    - 管理員：`admin@gzhomey.test` / `Admin1234`

    所有錯誤都回傳 `{ "ok": false, "message": "錯誤原因" }`。
servers:
  - url: /
tags:
  - name: Auth
    description: 會員註冊、登入
  - name: Products
    description: 商品（公開）
  - name: Admin
    description: 商品管理（限管理員）
  - name: Cart
    description: 購物車（需登入）

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        ok: { type: boolean, example: false }
        message: { type: string, example: 錯誤原因 }
    User:
      type: object
      properties:
        id: { type: integer, example: 2 }
        email: { type: string, example: user@gzhomey.test }
        name: { type: string, example: 測試會員 }
        role: { type: string, enum: [USER, ADMIN], example: USER }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        token: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
        user: { $ref: '#/components/schemas/User' }
    Category:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: 香氛蠟燭 }
        slug: { type: string, example: candles }
    Product:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: 木質雪松香氛蠟燭 }
        nameEn: { type: string, nullable: true, example: null }
        description: { type: string, example: 雪松與檀木的溫暖木質調 }
        price: { type: integer, example: 680 }
        stock: { type: integer, example: 20 }
        imageUrl: { type: string, example: 'https://picsum.photos/seed/gzhomey-candles-1/600/600' }
        affiliateUrl: { type: string, nullable: true, example: null }
        isActive: { type: boolean, example: true }
        categoryId: { type: integer, example: 1 }
        category: { $ref: '#/components/schemas/Category' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductInput:
      type: object
      properties:
        name: { type: string, maxLength: 100, example: 新的香氛蠟燭 }
        nameEn: { type: string, nullable: true, maxLength: 100 }
        description: { type: string, example: 商品介紹 }
        price: { type: integer, minimum: 0, example: 799 }
        stock: { type: integer, minimum: 0, example: 10 }
        imageUrl: { type: string, example: 'https://picsum.photos/seed/new/600/600' }
        affiliateUrl: { type: string, nullable: true }
        isActive: { type: boolean, example: true }
        categoryId: { type: integer, example: 1 }
    Pagination:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 8 }
        total: { type: integer, example: 24 }
        totalPages: { type: integer, example: 3 }
    CartItem:
      type: object
      properties:
        productId: { type: integer, example: 1 }
        quantity: { type: integer, example: 2 }
        subtotal: { type: integer, example: 1360 }
        product:
          type: object
          properties:
            id: { type: integer, example: 1 }
            name: { type: string, example: 木質雪松香氛蠟燭 }
            price: { type: integer, example: 680 }
            imageUrl: { type: string }
            stock: { type: integer, example: 20 }
            isActive: { type: boolean, example: true }
    Cart:
      type: object
      properties:
        ok: { type: boolean, example: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        totalQuantity: { type: integer, example: 2 }
        totalPrice: { type: integer, example: 1360 }
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema: { type: integer }
      example: 1
    CartProductId:
      name: productId
      in: path
      required: true
      schema: { type: integer }
      example: 1
  responses:
    BadRequest:
      description: 參數或欄位不正確
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 沒有登入或 token 無效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 需要管理員權限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 找不到資料
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: 註冊（一律建立一般會員，帶 role 也無效）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, example: newuser@example.com }
                password: { type: string, minLength: 6, example: secret123 }
                name: { type: string, maxLength: 50, example: 小明 }
      responses:
        '201':
          description: 註冊成功，直接回傳 token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email 已註冊
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/auth/login:
    post:
      tags: [Auth]
      summary: 登入
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: user@gzhomey.test }
                password: { type: string, example: User1234 }
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: 同一個 Email 15 分鐘內登入失敗 10 次，暫時擋住
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/auth/me:
    get:
      tags: [Auth]
      summary: 取得目前登入的使用者（前端重新整理後用）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/categories:
    get:
      tags: [Products]
      summary: 商品分類列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
  /api/products:
    get:
      tags: [Products]
      summary: 商品列表（只含上架商品，支援分頁、分類、關鍵字）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 }, description: 第幾頁 }
        - { name: limit, in: query, schema: { type: integer, default: 8, maximum: 50 }, description: 每頁幾筆 }
        - { name: category, in: query, schema: { type: string }, example: candles, description: 分類 slug }
        - { name: q, in: query, schema: { type: string }, example: 木, description: 關鍵字（比對名稱與描述） }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/products/{id}:
    get:
      tags: [Products]
      summary: 單一商品
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  product: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/products:
    post:
      tags: [Admin]
      summary: 新增商品（管理員）
      description: 必填 name、description、price、imageUrl、categoryId
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: 新增成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  product: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/products/{id}:
    put:
      tags: [Admin]
      summary: 編輯商品（管理員，只需傳要改的欄位）
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
            example: { price: 999, stock: 3 }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  product: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      summary: 刪除商品（管理員）
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      responses:
        '200':
          description: 刪除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  message: { type: string, example: 商品已刪除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/cart:
    get:
      tags: [Cart]
      summary: 查看購物車
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Cart]
      summary: 加入購物車（重複加入同商品 = 數量相加）
      description: 商品不存在或下架 → 404；數量不是正整數或加總超過庫存 → 400
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: integer, example: 1 }
                quantity: { type: integer, minimum: 1, default: 1, example: 1 }
      responses:
        '201':
          description: 加入成功，回傳整個購物車
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/cart/{productId}:
    patch:
      tags: [Cart]
      summary: 修改購物車商品數量（設定為指定數量）
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CartProductId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, example: 3 }
      responses:
        '200':
          description: 更新成功，回傳整個購物車
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Cart]
      summary: 從購物車移除商品
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CartProductId' }]
      responses:
        '200':
          description: 移除成功，回傳整個購物車
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
